  intro: >-
    TODO Five sections, ordered by how often a <user> needs them.
    These boards fix structure and behaviour only. Visual style comes in step 2.
  sections:
    # One entry per top-level navigation item. Five is a comfortable phone tab bar.
    - route: /
      name: TODO Home section
      question: TODO The question this section answers, in the user's words
      pages:
        - name: TODO Main page
          note: TODO What it shows, most important first
        - name: First-run setup
          note: TODO Same address. A checklist until the account is usable
    - route: /TODO-records
      name: TODO Records section
      question: TODO Record and check the core objects
      pages:
        - name: TODO List
          note: TODO Filters and search
        - name: TODO Detail
          route: /TODO-records/:id
          note: TODO View, edit, delete
        - name: TODO Add
          route: /TODO-records/new
        - name: TODO Bulk import
          route: /TODO-records/import
          release: 2
          note: TODO Upload, match columns, review rows, confirm
    - route: /TODO-task
      name: TODO Task section
      question: TODO The job the product exists to get done
      pages:
        - name: TODO Overview of the task
        - name: TODO Review and submit
          route: /TODO-task/:id/submit
        - name: TODO Receipt or result
          route: /TODO-task/results/:id
    - route: /settings
      name: Settings
