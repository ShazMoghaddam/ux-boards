name: check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 pyyaml
      - name: Examples are complete, valid and render
        run: |
          for spec in examples/*/spec.yaml; do
            python generator/generate.py build "$spec" -o "/tmp/$(basename "$(dirname "$spec")")" --strict
          done
      - name: Starter template renders
        run: python generator/generate.py build template/spec.yaml -o /tmp/template
