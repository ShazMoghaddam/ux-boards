# ================================================================ screens
# Each entry is one board. Frames sit side by side and are scaled to fit.
# device: phone | tablet | desktop. nav: the section to highlight (omit for
# full-screen tasks). style: wire (default) or styled (uses the visual system).
screens:
  - title: TODO Home, phone
    route: /
    purpose: TODO What this screen must do, in one sentence
    frames:
      - device: phone
        nav: TODO Home section
        appbar: {left: TODO Product name, right: TODO Context}
        blocks:
          - eyebrow: Next step
          - title: TODO The one thing to do next
          - text: TODO Why, and by when
          - button: TODO Primary action
            full: true
          - divider: true
          - heading: TODO Summary
          - rows:
              - [TODO Label, TODO Value]
              - {label: TODO Total, value: TODO Value, strong: true}
          - heading: Recent
            link: See all
          - list:
              - {title: TODO Item, meta: TODO Date and context, value: TODO Amount}

  - title: TODO Main task, phone
    route: /TODO-task/:id/submit
    purpose: TODO A full-screen task. One decision per step, nothing sent until the last
    frames:
      - device: phone
        appbar: {title: TODO Task name, right: "Exit ✕"}
        blocks:
          - stepper: {step: 1, total: 2}
          - title: TODO Check
            small: true
          - rows:
              - [TODO Label, TODO Value]
        footer:
          - button: TODO These are right
            full: true
      - device: phone
        appbar: {left: "‹ Back", title: TODO Task name, right: Exit}
        blocks:
          - stepper: {step: 2, total: 2}
          - title: TODO Confirm and send
            small: true
          - checkbox: TODO I confirm this is correct
            boxed: true
        footer:
          - button: TODO Send
            kind: disabled
            full: true

# ================================================================ Step 2: visual system
visual:
  intro: TODO Three or four words for the feel, then the few decisions that create it
  accessibility_note: Every text colour passes WCAG AA on white. Status is always carried by words and shape as well as colour.
  # token maps a colour onto the screen boards: ink, muted, primary, tint,
  # shelf, rule, danger, warning (with `on` for its background).
  # role: text (default, contrast is checked), fill, or line.
  colours:
    - {name: Ink, hex: "#1F2328", use: TODO Text and totals, token: ink}
    - {name: Muted, hex: "#59636E", use: TODO Secondary text, token: muted}
    - {name: TODO Brand, hex: "#0B5CAD", use: TODO Primary actions and links, token: primary}
    - {name: Tint, hex: "#E7EFF8", use: TODO Selected row, role: fill, token: tint}
    - {name: Shelf, hex: "#F4F5F6", use: TODO Navigation background, role: fill, token: shelf}
    - {name: Rule, hex: "#D8DDE2", use: TODO Dividers, role: line, token: rule}
    - {name: Amber, hex: "#8A4B00", on: "#FBEFD9", use: TODO Needs attention, token: warning}
    - {name: Red, hex: "#A1262B", use: TODO Errors and destructive actions only, token: danger}
  rules:
    - TODO One rule about colour you will not break
  type:
    # Optional web-font stylesheet; system fonts are used if it cannot load.
    # import_url: "https://fonts.googleapis.com/css2?family=...&display=swap"
    serif: {family: "Georgia, serif"}
    sans: {family: "'Helvetica Neue', Arial, sans-serif"}
    scale:
      - {role: Page title, font: serif, size: 32, line: 38, weight: 600, sample: TODO A real headline}
      - {role: Section, font: serif, size: 22, line: 28, weight: 600, sample: TODO Section name}
      - {role: Key figure, font: sans, size: 34, line: 40, weight: 600, tabular: true, sample: "1,234.00"}
      - {role: Label, font: sans, size: 16, line: 24, weight: 600, sample: TODO Field label}
      - {role: Body, font: sans, size: 16, line: 24, weight: 400, sample: TODO A real sentence from the product}
      - {role: Caption, font: sans, size: 14, line: 20, weight: 400, muted: true, sample: TODO Supporting detail}
  signature:
    name: TODO The signature element
    description: TODO The one visual idea that makes the product recognisable, and where it appears
    marker: {at: 40, label: Today}
    segments:
      - {label: TODO Stage 1, sub: Done, state: done}
      - {label: TODO Stage 2, sub: Current, state: current}
      - {label: TODO Stage 3, sub: In progress, state: progress}
      - {label: TODO Stage 4, sub: Not started, state: todo}
  components:
    - buttons:
        - {value: TODO Primary, kind: primary}
        - {value: TODO Secondary, kind: secondary}
        - {value: Cancel, kind: ghost}
        - {value: TODO Delete, kind: danger}
        - {value: TODO Disabled, kind: disabled}
    - fields:
        - {label: TODO Label, hint: TODO Hint, value: TODO Value}
        - {label: TODO Label, error: "TODO Say what to do, not what went wrong", value: TODO Bad value}
    - status:
        - {label: Done, shape: check}
        - {label: TODO Current, shape: dot}
        - {label: In progress, shape: half}
        - {label: Not started, shape: dashed}
        - {label: TODO Due soon, shape: warn}
  tokens:
    - [Spacing, "4, 8, 12, 16, 24, 32, 48, 64 px"]
    - [Corners, "4 px controls, 8 px sheets and dialogs"]
    - [Elevation, "None on the page. One shadow, only for sheets, menus and dialogs"]
    - [Targets, "44 px minimum"]
