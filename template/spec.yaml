      pages:
        - name: TODO Connection or account
          route: /settings/TODO
        - name: Profile and preferences
          release: 2

  # The two or three journeys the product must get right. The last step of each
  # path is drawn filled; anything with release: 2 is drawn dashed.
  journeys:
    - name: TODO Main job
      paths:
        - [TODO Entry point, TODO Step, TODO Step, TODO Confirm, TODO Outcome]
    - name: TODO Record data
      paths:
        - [TODO List, TODO Add, "TODO Back to list, row highlighted"]
        - [{label: TODO Upload file, release: 2}, {label: TODO Review rows, release: 2}]
    - name: First run
      paths:
        - [TODO First step, TODO Second step, TODO Ready]

  notes:
    - title: Cross-links
      body: TODO Which pages open which, already filtered
    - title: Outside the sections
      body: TODO Sign in, not found, error pages, return from third-party sign-in
    - title: Open questions
