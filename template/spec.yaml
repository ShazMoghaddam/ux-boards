# ux-boards starter spec
# ---------------------------------------------------------------------------
# Replace every value that starts with TODO. `generate.py check` lists the ones
# you have missed, and `--strict` refuses to build until they are all gone.
# Delete any board you do not need: only project and ia are required.
# Full block reference: docs/SPEC.md. Worked example: examples/bindery/spec.yaml
# ---------------------------------------------------------------------------

project:
  name: TODO Product name
  short: TODO          # two letters for the tablet rail, e.g. "Bd"
  tagline: TODO One line on who it is for and what it does

release_labels:
  1: First release
  2: Next release

