name: check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 pyyaml
      - name: Example spec is complete and valid
        run: python generator/generate.py check examples/bindery/spec.yaml --strict
      - name: Example renders
        run: python generator/generate.py build examples/bindery/spec.yaml -o /tmp/bindery
      - name: Starter template renders
        run: python generator/generate.py build template/spec.yaml -o /tmp/template
